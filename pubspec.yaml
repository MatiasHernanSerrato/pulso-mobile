name: pulso_mobile
description: "Pulso mobile app - salud + plata en un solo lugar."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # state management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # navegacion
  go_router: ^14.2.7

  # http client para pulso-api
  dio: ^5.7.0

  # graficos (tendencia de peso principalmente)
  fl_chart: ^0.69.0

  # formateo de fechas en graficos / listas
  intl: ^0.19.0

  # modelos inmutables
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # codegen
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.13

  # icono + splash para android / ios
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/pulso_icon.png"
  min_sdk_android: 23
  adaptive_icon_background: "#1E463A"
  adaptive_icon_foreground: "assets/branding/pulso_icon_fg.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#1E463A"
  image: assets/branding/pulso_splash.png
  color_dark: "#102820"
  image_dark: assets/branding/pulso_splash.png
  android_12:
    image: assets/branding/pulso_splash.png
    color: "#1E463A"
    image_dark: assets/branding/pulso_splash.png
    color_dark: "#102820"
  android: true
  ios: true
  web: false
  fullscreen: false
